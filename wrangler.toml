name = "turso-github-mcp"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Free tier: 100,000 requests/day. The only "infrastructure" this needs
# beyond the Worker itself is a KV namespace, which @cloudflare/workers-
# oauth-provider uses to store OAuth client registrations, grants, and
# token hashes (never raw secrets -- see the library's README). Create
# it once with:
#
#   npx wrangler kv namespace create OAUTH_KV
#
# then paste the "id" it prints into the binding below.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "587f72d065cb45e1b3c0a68d556cafe5"

# Non-secret config, safe to commit. WORKER_URL is this Worker's own
# https://....workers.dev base URL -- CodeCellWorkflow's
# fast-worker-dispatch step needs it to publish a QStash message back to
# this same Worker's own /qstash/fast-worker-generate route (Section 4f;
# see code_cell_workflow.ts and auth.ts). Also the base URL Section 7d/7f's
# graph-embedding-backfill/graph-heartbeat QStash schedules point at.
# Update this if the Worker is ever renamed or moved to a custom domain.
[vars]
WORKER_URL = "https://turso-github-mcp.intorie.workers.dev"

# JobWorkflow (workflows.ts): a generic multi-step durable job. Triggered
# via the workflow_* MCP tools.
[[workflows]]
binding = "JOB_WORKFLOW"
name = "turso-github-mcp-job-workflow"
class_name = "JobWorkflow"

# TaskRunner (runner.ts): a persistent per-name Durable Object actor with
# its own task queue, driven via the runner_* MCP tools. SQLite-backed
# storage (new_sqlite_classes) is the current default for new DO classes.
[[durable_objects.bindings]]
name = "RUNNER"
class_name = "TaskRunner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TaskRunner"]

# CodeCellWorkflow (code_cell_workflow.ts): Section 4f's durable per-cell
# pipeline (Fast Worker -> Heavy Worker -> tag -> notify). Triggered via
# the cell_create MCP tool; resumed by /webhook/heavy-worker-result and
# /qstash/fast-worker-generate (auth.ts) via step.waitForEvent.
[[workflows]]
binding = "CODE_CELL_WORKFLOW"
name = "turso-github-mcp-code-cell-workflow"
class_name = "CodeCellWorkflow"

# Secrets (set with `wrangler secret put <n>`, never in this file or
# in a committed .dev.vars):
#   MCP_AUTH_TOKEN        -- password that gates the /authorize consent
#                            screen; only you should know it
#   GITHUB_TOKEN          -- PAT with repo + workflow scopes
#   TURSO_DATABASE_URL    -- e.g. libsql://your-db.turso.io
#   TURSO_AUTH_TOKEN      -- from `turso db tokens create <database-name>`
#   DISCORD_BOT_TOKEN     -- bot token from https://discord.com/developers/
#                            applications (Bot tab -> Reset Token). Invite
#                            the bot to each server it needs to act in,
#                            with the relevant permissions (Send Messages,
#                            Manage Channels, Add Reactions, etc.).
#   CLOUDFLARE_API_TOKEN  -- scoped API token (NOT the Global API Key) for
#                            the cloudflare_search/cloudflare_execute
#                            proxy tools, which forward to Cloudflare's
#                            own mcp.cloudflare.com server. Create one at
#                            https://dash.cloudflare.com/profile/api-tokens
#                            with only the scopes you want this connector
#                            to have -- e.g. Workers Scripts:Edit (to let
#                            it redeploy this Worker), Workflows:Edit,
#                            Account Settings:Read. This token effectively
#                            becomes this connector's permission ceiling
#                            for all of Cloudflare, so scope it narrowly.
#   NEO4J_URI             -- e.g. "neo4j+s://xxxx.databases.neo4j.io" (Aura)
#                            or "https://host:7474" (self-hosted). Talks to
#                            the HTTP Query API, not Bolt.
#   NEO4J_USERNAME         -- HTTP Basic auth, sent per-request.
#   NEO4J_PASSWORD         -- HTTP Basic auth, sent per-request.
#   NEO4J_DATABASE         -- optional, defaults to "neo4j". IMPORTANT: if
#                            neo4j_execute_query/graph_* tools ever start
#                            returning "Database does not exist. Database
#                            name: 'neo4j'", the Aura instance's actual
#                            database name doesn't match this default, or
#                            the instance itself needs waking/resuming --
#                            check the Aura console (console.neo4j.io) for
#                            the instance's live status and real database
#                            name, and set this explicitly if it differs.
#                            (Observed live against this project's own
#                            instance while building Section 7 -- flagging
#                            here so it isn't re-discovered from scratch.)
#   UPSTASH_EMAIL          -- Upstash account email, for the Developer
#                            (Management) API at api.upstash.com. Paired
#                            with UPSTASH_API_KEY as HTTP Basic auth.
#                            NOTE: this key type is account-wide -- it can
#                            manage every Redis database on the account,
#                            not just one, so treat it accordingly.
#   UPSTASH_API_KEY       -- see UPSTASH_EMAIL above.
#   GROQ_API_KEY          -- from https://console.groq.com/keys, for the
#                            groq_* fast-inference tools.
#   POSTHOG_API_KEY       -- PostHog Personal API key (bearer token),
#                            proxied through to PostHog's own hosted
#                            remote MCP server.
#   POSTHOG_MCP_URL       -- optional, defaults to https://mcp.posthog.com/mcp
#                            (US region). Set to https://mcp-eu.posthog.com/mcp
#                            for EU-region PostHog accounts.
#   GEMINI_API_KEY        -- from https://aistudio.google.com/apikey. Powers
#                            gemini_* (Fast Worker fallback tiers, Gemma 4
#                            tagging, response_schema, google_search
#                            grounding, embeddings) AND antigravity_* (same
#                            key, different endpoint -- see antigravity.ts)
#                            AND graph_* (Section 7's Embedding 1<->2 pair,
#                            via the same gemini_embed_content wrapper --
#                            see graph.ts). No separate credential needed
#                            for the graph layer.
#   QSTASH_TOKEN          -- QStash's OWN bearer token (QStash tab at
#                            https://console.upstash.com), NOT the same
#                            credential as UPSTASH_EMAIL/UPSTASH_API_KEY
#                            above -- those manage Redis databases via a
#                            different API, this publishes/schedules
#                            messages via qstash.upstash.io. Powers qstash_*
#                            AND CodeCellWorkflow's fast-worker-dispatch
#                            step (Section 4f) AND Section 7d/7f's graph
#                            backfill/keepalive schedules.
#   QSTASH_URL            -- optional, defaults to https://qstash.upstash.io.
#                            REQUIRED if your Upstash account is
#                            region-provisioned (e.g. EU) rather than the
#                            global default -- a region-scoped QSTASH_TOKEN
#                            fails auth ("invalid token", 401) against the
#                            global endpoint with no hint it's a region
#                            mismatch. Check the QStash tab at
#                            https://console.upstash.com for a QSTASH_URL
#                            line alongside QSTASH_TOKEN; if present, set
#                            it here verbatim (e.g.
#                            "https://qstash-eu-central-1.upstash.io", no
#                            trailing /v2 -- that's added automatically).
#   GRAPH_CRON_TOKEN      -- a random secret (e.g. `openssl rand -hex 32`),
#                            checked on POST /webhook/graph-embedding-backfill
#                            and POST /webhook/graph-heartbeat (Section 7d,
#                            7f). Deliberately separate from every other
#                            callback token in this file -- nothing
#                            external needs to know this value, it's only
#                            ever forwarded by this project's own QStash
#                            schedules via Upstash-Forward-Authorization
#                            (same mechanism FAST_WORKER_CALLBACK_TOKEN
#                            uses -- see auth.ts and qstash.ts).
#
# --- CodeCellWorkflow-specific (code_cell_workflow.ts) ---------------------
#   HEAVY_WORKER_REPO         -- "owner/name" of the repo containing
#                                .github/workflows/test.yml, e.g.
#                                "abbashaji/ondine". Reuses GITHUB_TOKEN
#                                above (needs repo + workflow scopes).
#   HEAVY_WORKER_CALLBACK_TOKEN -- a random secret ONLY the GitHub Actions
#                                runner should know (e.g. `openssl rand
#                                -hex 32`), checked on POST
#                                /webhook/heavy-worker-result. Deliberately
#                                separate from MCP_AUTH_TOKEN, which gates
#                                the human /authorize screen. Set as a
#                                repo secret of the same name in
#                                HEAVY_WORKER_REPO's Settings -> Secrets
#                                and variables -> Actions, alongside
#                                GATEWAY_URL (this Worker's own
#                                https://....workers.dev base URL).
#   DISCORD_ALERT_CHANNEL_ID  -- channel (snowflake id) urgent CodeCell
#                                tags (needs_human, dead_letter) get
#                                posted to. Optional -- alerts are skipped
#                                if unset. Reuses DISCORD_BOT_TOKEN above.
#   FAST_WORKER_CALLBACK_TOKEN -- a random secret (e.g. `openssl rand -hex
#                                32`), checked on POST
#                                /qstash/fast-worker-generate. Deliberately
#                                separate from MCP_AUTH_TOKEN and
#                                HEAVY_WORKER_CALLBACK_TOKEN -- this one
#                                gates the QStash-paced Fast Worker
#                                dispatch route (Section 4f), forwarded on
#                                each publish via the
#                                Upstash-Forward-Authorization header (see
#                                code_cell_workflow.ts's fast-worker-
#                                dispatch step). Nothing external needs to
#                                know this value -- unlike
#                                HEAVY_WORKER_CALLBACK_TOKEN it is never
#                                set anywhere outside this Worker.
#   FAST_WORKER_RATE_PER_MINUTE -- optional PLAINTEXT var (not a secret --
#                                fine to set via `wrangler secret put` or
#                                add to [vars] above), defaults to "20" if
#                                unset. Caps how many CodeCells' Fast
#                                Worker dispatches QStash releases per
#                                minute, across every concurrently-running
#                                CodeCellWorkflow instance combined (see
#                                Section 2's QStash row on the disputed
#                                Groq daily-cap figures -- start
#                                conservative and raise once you've
#                                confirmed your account's actual
#                                rate-limit-remaining/-reset headers).
#   FAST_WORKER_PARALLELISM   -- optional, unset by default (no
#                                parallelism cap, rate-only pacing). Caps
#                                how many fast-worker-generate calls can
#                                be in flight at once across every
#                                instance.
#
# --- Object storage (Section 9, revised: GitHub Releases + Backblaze B2) ---
#   GITHUB_RELEASE_ARTIFACTS_REPO -- optional PLAINTEXT var (fine to add to
#                                [vars] above instead of a secret), defaults
#                                to "abbashaji/remote_mcp" (this Worker's own
#                                source repo) if unset. "owner/name" of the
#                                repo the github_release_* tools write to --
#                                all assets accumulate under one rolling
#                                release (tag "v0-artifacts") on this repo.
#                                Reuses GITHUB_TOKEN above; no new credential.
#                                Set this only if artifacts should live in a
#                                separate repo from the Worker's source --
#                                see github_release.ts.
#   B2_KEY_ID / B2_APPLICATION_KEY / B2_BUCKET_NAME / B2_ENDPOINT -- Backblaze
#                                B2 S3-compatible credentials for the b2_*
#                                tools (b2.ts) -- arbitrary keys, frequent
#                                writes, prefix listing, per-object deletes.
#                                No wrangler binding needed (plain
#                                authenticated HTTP out, same shape as
#                                UPSTASH_*/GROQ_API_KEY above).
